<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celeris2D project</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --panel2: #1d2029; --panel3: #242833; --line: #2a2e3a; --ink: #f0efec; --ink2: #a0a3ad; --ink3: #767a86;
    --accent: #3987e5; --accent2: #1c3350; --good: #0ca30c; --bad: #d03b3b; --warn: #fab219; --serious: #ec835a;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f9f9f7; --panel: #fcfcfb; --panel2: #f0efec; --panel3: #e8e7e3; --line: #e1e0d9; --ink: #0b0b0b; --ink2: #52514e; --ink3: #898781;
    --accent: #2a78d6; --accent2: #dbe9fb; color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 46px; }
  header h1 { font-size: 18px; margin: 0; white-space: nowrap; }
  header h1 span { color: var(--accent); }
  #root { color: var(--ink2); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a { color: var(--accent); text-decoration: none; }
  button { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font: inherit; width: 100%; }
  .wrap { display: grid; grid-template-columns: minmax(340px, 34%) 1fr; height: calc(100vh - 46px); }
  aside { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  .filter { position: sticky; top: 0; background: var(--panel); padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .job { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
  .job:hover { background: var(--panel2); }
  .job.sel { background: var(--accent2); }
  .job .n { color: var(--ink3); font: 12px ui-monospace, Menlo, monospace; }
  .job .t { font-weight: 600; }
  .job .l { color: var(--ink2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job .k { color: var(--ink2); font-size: 11.5px; text-align: right; white-space: nowrap; }
  .st { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--ink3); }
  .st.finished { background: var(--good); } .st.running { background: var(--warn); } .st.failed { background: var(--bad); }
  main { overflow-y: auto; padding: 16px 22px 60px; min-width: 0; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--ink2); margin: 22px 0 8px; }
  .muted { color: var(--ink2); } .err { color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 2px 9px; font-size: 12px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  table.kv { border-collapse: collapse; font-size: 12.5px; }
  table.kv td { padding: 3px 14px 3px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
  table.kv td:first-child { color: var(--ink2); white-space: nowrap; }
  table.kv td:last-child { font-variant-numeric: tabular-nums; word-break: break-word; }
  .figs img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; margin: 0 0 12px; background: var(--panel); }
  .warnbox { border: 1px solid var(--serious); border-radius: 6px; padding: 8px 12px; margin: 10px 0; color: var(--ink); }
  .warnbox b { color: var(--serious); }
  .figs .cap { color: var(--ink3); font-size: 11.5px; margin: -8px 0 14px; }
  details summary { cursor: pointer; color: var(--ink2); }
  .log { max-height: 340px; overflow: auto; font: 11.5px ui-monospace, Menlo, monospace; white-space: pre-wrap;
         background: var(--panel2); padding: 8px 10px; border-radius: 6px; margin: 6px 0 0; }
  .files a { display: block; font: 12px ui-monospace, Menlo, monospace; padding: 2px 0; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
  .empty { color: var(--ink3); padding: 40px; text-align: center; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; height: auto; } aside { max-height: 45vh; } }
</style>
</head>
<body>
<header>
  <h1>Celeris<span>2D</span> project</h1>
  <div id="root">loading...</div>
  <a href="/">2D dashboard</a>
  <button id="newjob" class="primary" title="make a job of any type, its form built from the job type's settings">New job</button>
  <button id="theme" title="switch the page and its figures between dark and light">Light</button>
  <button id="refresh">Refresh</button>
</header>
<div class="wrap">
  <aside>
    <div class="filter"><input id="q" placeholder="filter: number, type, label, status"></div>
    <div id="list"></div>
  </aside>
  <main id="detail"><div class="empty">Select a job.</div></main>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let jobs = [], current = null, timer = null;
let theme = 'dark';
try { theme = localStorage.getItem('celeris-theme') || 'dark'; } catch (e) {}
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  $('#theme').textContent = theme === 'dark' ? 'Light' : 'Dark';
}
// a figure x.png has a light variant x.light.png (plotstyle.py); pick the one matching the page
const isVariant = p => /\.(light|dark)\.png$/.test(p);
function figFor(path, files) {
  if (theme !== 'light') return path;
  const lp = path.replace(/\.png$/, '.light.png');
  return files.some(f => f.path === lp) ? lp : path;
}

// the number a job is judged by: from its job type's spec on the server (jobspec.key_of)
const key = j => j.key || '';

async function load() {
  const r = await fetch('/api/project');
  if (!r.ok) { $('#root').textContent = (await r.json()).detail; return; }
  const d = await r.json();
  $('#root').innerHTML = `<b>${esc(d.root)}</b> · ${d.jobs.length} jobs` + (d.running.length ? ` · running: ${esc(d.running.join(', '))}` : '');
  jobs = d.jobs;
  renderList();
  if (current) showJob(current, false);
  clearTimeout(timer);
  if (jobs.some(j => j.status === 'running')) timer = setTimeout(load, 5000);
}

function renderList() {
  const q = $('#q').value.trim().toLowerCase();
  const rows = jobs.filter(j => !q || `${j.name} ${j.type} ${j.status}`.toLowerCase().includes(q)).reverse();
  $('#list').innerHTML = rows.map(j => `
    <div class="job ${j.name === current ? 'sel' : ''}" data-n="${esc(j.name)}">
      <div class="n">${String(j.id).padStart(3, '0')}</div>
      <div><div class="t"><span class="st ${esc(j.status)}" title="${esc(j.status)}"></span>${esc(j.type)}</div>
           <div class="l">${esc(j.label || '')}</div></div>
      <div class="k">${esc(key(j))}</div>
    </div>`).join('') || '<div class="empty">No jobs.</div>';
  document.querySelectorAll('.job').forEach(e => e.onclick = () => showJob(e.dataset.n));
}

function kv(obj) {
  return '<table class="kv">' + Object.entries(obj).map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</td></tr>`).join('') + '</table>';
}

async function showJob(name, scroll = true) {
  current = name;
  renderList();
  const r = await fetch('/api/project/job?job=' + encodeURIComponent(name));
  const j = await r.json();
  if (!r.ok) { $('#detail').innerHTML = `<div class="err">${esc(j.detail)}</div>`; return; }
  if (current !== j.name) { current = j.name; renderList(); }
  history.replaceState(null, '', '#' + j.name.slice(0, 3));
  const hide = new Set(['history', 'figures', 'warnings']);
  const summ = Object.fromEntries(Object.entries(j.summary || {}).filter(([k, v]) => !hide.has(k) && (!Array.isArray(v) || v.length <= 8)));
  const warns = (j.summary || {}).warnings || [];
  const isFig = p => /\.(png|gif)$/.test(p);
  const figs = j.files.filter(f => isFig(f.path) && !isVariant(f.path));
  const other = j.files.filter(f => !isFig(f.path));
  const canRerun = !['Import', 'Select'].includes(j.type);
  const chips = (arr) => arr.length ? `<div class="chips">${arr.map(n => `<span class="chip" data-n="${esc(n)}">${esc(n)}</span>`).join('')}</div>` : '<span class="muted">none</span>';
  $('#detail').innerHTML = `
    <h2>${esc(j.name)}</h2>
    <div class="muted"><span class="st ${esc(j.status)}"></span>${esc(j.status)} · ${esc(j.type)}</div>
    ${j.error ? `<p class="err">${esc(j.error)}</p>` : ''}
    ${warns.length ? `<div class="warnbox">${warns.map(w => `<div><b>⚠ warning</b> ${esc(w)}</div>`).join('')}</div>` : ''}
    <div class="bar">
      ${types[j.type] ? `<button id="edit" title="the New job form with this job's inputs and settings">Change settings and run</button>` : ''}
      ${canRerun ? `<button class="primary" id="rerun" ${j.status === 'running' ? 'disabled' : ''}>${['MotionCtf', 'Pick', 'Extract'].includes(j.type) ? 'Continue (new movies)' : 'Run again as a new job'}</button>` : ''}
    </div>
    <h3>Comes from</h3>${chips(j.lineage.slice(1))}
    <h3>Used by</h3>${chips(j.dependents)}
    <h3>Results</h3>${kv(summ)}
    ${figs.length ? `<h3>Figures</h3><div class="figs">${figs.map(f => `<img loading="lazy" src="/api/project/file?path=${encodeURIComponent(figFor(f.path, j.files))}&t=${Date.now()}" alt="${esc(f.path)}"><div class="cap">${esc(f.path)}</div>`).join('')}</div>` : ''}
    ${other.length ? `<h3>Files</h3><div class="files">${other.map(f => `<a href="/api/project/file?path=${encodeURIComponent(f.path)}" download>${esc(f.path)} (${(f.size / 1e6).toFixed(1)} MB)</a>`).join('')}</div>` : ''}
    ${j.movie_figures ? `<p class="muted">${j.movie_figures} per-micrograph figures in figures/movies/</p>` : ''}
    <h3>Log</h3><details id="logbox" ${j.status === 'running' ? 'open' : ''}><summary>${j.log ? esc(j.log) : 'no run log (jobs made before run logs, or not started)'}</summary><pre id="log" class="log"></pre></details>
    <h3>Parameters</h3><details><summary>${Object.keys(j.params).length} parameters</summary>${kv(j.params)}</details>`;
  followLog(j.name);
  document.querySelectorAll('#detail .chip').forEach(e => e.onclick = () => showJob(e.dataset.n));
  const eb = $('#edit');
  if (eb) eb.onclick = () => jobForm(j.type, j.params);
  const b = $('#rerun');
  if (b) b.onclick = async () => {
    if (!confirm(`Run ${j.name} again?`)) return;
    b.disabled = true;
    const r = await fetch('/api/project/rerun', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({job: j.name})});
    const d = await r.json();
    if (!r.ok) { alert(d.detail); b.disabled = false; return; }
    current = d.job;
    load();
  };
  if (scroll) $('#detail').scrollTop = 0;
}

// ------------------------------------------------------------------ New job (built from /api/project/jobtypes)
let types = {};
async function loadTypes() {
  try {
    const r = await fetch('/api/project/jobtypes');
    if (r.ok) types = Object.fromEntries((await r.json()).map(t => [t.type, t]));
  } catch (e) {}
}

function fieldInput(f, v) {
  const id = 'f_' + f.name;
  const val = v === undefined ? f.default : v;
  if (f.kind === 'bool') return `<input type="checkbox" id="${id}" ${val ? 'checked' : ''}>`;
  const shown = Array.isArray(val) ? val.join(', ') : (val == null ? '' : val);
  const type = (f.kind === 'int' || f.kind === 'float') ? 'number' : 'text';
  const step = f.kind === 'float' ? 'any' : '1';
  return `<input type="${type}" ${type === 'number' ? `step="${step}"` : ''} id="${id}" value="${esc(shown)}">`;
}

function jobForm(type, params = {}) {
  current = null;
  renderList();
  const names = Object.keys(types);
  if (!names.length) { $('#detail').innerHTML = '<div class="err">no job types (server too old?)</div>'; return; }
  type = type || names[0];
  const t = types[type];
  const sel = jobs.filter(x => x.status === 'finished');
  const opt = (inp) => {
    const ok = sel.filter(x => inp.types.includes(x.type));
    const pre = params[inp.name] != null ? Number(params[inp.name]) : (ok.length ? ok[ok.length - 1].id : null);
    return (inp.optional ? '<option value="">(default)</option>' : '') +
      ok.map(x => `<option value="${x.id}" ${x.id === pre ? 'selected' : ''}>${esc(x.name)} ${esc(key(x))}</option>`).join('');
  };
  $('#detail').innerHTML = `
    <h2>New job</h2>
    <div class="bar"><select id="ftype">${names.map(n => `<option ${n === type ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <span class="muted">${esc(t.title)}</span></div>
    <h3>Inputs</h3>
    <table class="kv">${t.inputs.map(i => `<tr><td>${esc(i.name)}${i.optional ? '' : ' *'}</td><td><select id="in_${esc(i.name)}">${opt(i)}</select>
      <div class="muted">${esc(i.doc)} (${esc(i.types.join(' / '))})</div></td></tr>`).join('')}</table>
    <h3>Settings</h3>
    <table class="kv">${t.settings.map(f => `<tr><td>${esc(f.name)}</td><td>${fieldInput(f, params[f.name])}
      <div class="muted">${esc(f.help)}</div></td></tr>`).join('')}</table>
    <div class="bar"><input id="flabel" placeholder="label (optional)" style="flex: 1; max-width: 360px"><button class="primary" id="frun" style="white-space: nowrap">Make and run</button></div>
    <p class="err" id="ferr"></p>`;
  $('#ftype').onchange = e => jobForm(e.target.value);
  $('#frun').onclick = async () => {
    const inputs = {}, settings = {};
    t.inputs.forEach(i => { const v = $('#in_' + i.name).value; if (v) inputs[i.name] = Number(v); });
    t.settings.forEach(f => {
      const el = $('#f_' + f.name);
      settings[f.name] = f.kind === 'bool' ? el.checked : el.value;
    });
    $('#frun').disabled = true;
    const r = await fetch('/api/project/new', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type, inputs, settings, label: $('#flabel').value})});
    const d = await r.json();
    if (!r.ok) { $('#ferr').textContent = d.detail; $('#frun').disabled = false; return; }
    current = d.job;
    load();
  };
}
$('#newjob').onclick = () => jobForm(current && types[(jobs.find(x => x.name === current) || {}).type] ? jobs.find(x => x.name === current).type : null);

let logTimer = null;
async function followLog(name, offset = 0) {   // the run log, appended every 3 s while the job runs
  clearTimeout(logTimer);
  if (current !== name || !$('#log')) return;
  const r = await fetch(`/api/project/log?job=${encodeURIComponent(name)}&offset=${offset}`);
  if (!r.ok || current !== name) return;
  const d = await r.json();
  const pre = $('#log');
  const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
  pre.textContent += d.text;
  if (atEnd) pre.scrollTop = pre.scrollHeight;
  if (d.status === 'running') logTimer = setTimeout(() => followLog(name, d.offset), 3000);
  else if (offset && d.text) showJob(name, false);   // just finished: show its results
}

$('#q').oninput = renderList;
$('#theme').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('celeris-theme', theme); } catch (e) {}
  applyTheme();
  if (current) showJob(current, false);
};
applyTheme();
loadTypes();
$('#refresh').onclick = load;
if (location.hash.length > 1) current = decodeURIComponent(location.hash.slice(1));   // /project#014 opens job 14
load();
</script>
</body>
</html>
