<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celeris project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* the plots' own dark theme (plotstyle.py), so a page and its figures are one surface */
  :root {
    --plane: #0E1014; --surface: #161920; --well: #1D212A; --raise: #242833; --line: #272C36; --axis: #3A404C;
    --ink: #ECEEF1; --ink2: #A3A9B5; --ink3: #7C8390;
    --data: #4C8DF6; --data-dim: #1C2B45; --you: #F2B33D; --you-dim: #2A2412;
    --good: #3FB37F; --bad: #E5484D; --serious: #EC835A;
    --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--plane); color: var(--ink); font: 14px/1.45 var(--font); font-variant-numeric: tabular-nums; }
  a { color: var(--data); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
  button { background: var(--well); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px;
           font: inherit; font-size: 13px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink3); }
  button.go { background: var(--data); border-color: var(--data); color: #fff; font-weight: 600; }
  button.go:hover:not(:disabled) { filter: brightness(1.1); border-color: var(--data); }
  button.you { background: var(--you); border-color: var(--you); color: #1b1404; font-weight: 700; }
  button.quiet { background: transparent; border-color: transparent; color: var(--ink2); }
  button.quiet:hover:not(:disabled) { color: var(--ink); border-color: var(--line); }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: #fff; background: var(--bad); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input, select { background: var(--well); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font: inherit; }
  input[type=range] { padding: 0; accent-color: var(--data); }
  input[type=checkbox] { accent-color: var(--data); }

  /* frame */
  .top { display: flex; align-items: center; gap: 16px; height: 50px; padding: 0 16px 0 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: -.2px; white-space: nowrap; color: var(--ink); } .brand:hover { text-decoration: none; }
  .brand b { color: var(--data); font-weight: 700; }
  .proj { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 10px; padding-left: 16px; border-left: 1px solid var(--line); }
  .proj .name { font-weight: 600; font-size: 15px; white-space: nowrap; }
  .proj .path { color: var(--ink3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pulse { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink2); white-space: nowrap; }
  .pulse .d { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
  .pulse .d.on { background: var(--you); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .pulse .d.on { animation: none; } }
  .menu { position: relative; }
  .menu summary { list-style: none; cursor: pointer; padding: 6px 12px; border: 1px solid var(--line); border-radius: 7px; font-size: 13px; background: var(--well); }
  .menu summary::-webkit-details-marker { display: none; }
  .menu summary::after { content: " ▾"; color: var(--ink3); }
  .menu[open] summary { border-color: var(--ink3); }
  .menu-list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--raise); border: 1px solid var(--line); border-radius: 9px; padding: 5px; display: flex; flex-direction: column; min-width: 210px; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .menu-list button { text-align: left; background: none; border: none; padding: 8px 10px; border-radius: 6px; }
  .menu-list button:hover:not(:disabled) { background: var(--well); }
  .wrap { display: grid; grid-template-columns: 318px 1fr; height: calc(100vh - 50px); }
  .rail { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); }
  main { overflow-y: auto; min-width: 0; }

  /* rail: the waiting choices, the queue, then the project as its processing line - stages in order, each job a
     stop on the line */
  .sect { padding: 12px 14px 6px; }
  .sect h2 { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .ask { display: block; width: 100%; text-align: left; background: var(--you-dim); border: 1px solid var(--you); border-radius: 9px;
         padding: 9px 11px; margin: 0 0 8px; color: var(--ink); cursor: pointer; }
  .ask strong { color: var(--you); display: block; font-size: 13px; }
  .ask span { color: var(--ink2); font-size: 12px; }
  .q { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; padding: 4px 2px; font-size: 13px; }
  .q .who { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
  .q .who .ico { width: 20px; height: 20px; border-radius: 5px; } .q .who .ico svg { width: 13px; height: 13px; } .q .who .dot { margin: 0; }
  .q .who:hover { color: var(--data); }
  .q .st { color: var(--ink3); font-size: 12px; }
  .tog { display: flex; gap: 7px; align-items: center; color: var(--ink2); font-size: 12px; margin: 6px 0 2px; }
  .find { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 10px 14px; border-top: 1px solid var(--line); }
  .find input { width: 100%; }
  /* job types: category colour + glyph */
  :root { --k-mic: #2fb8a8; --k-ptc: #a2c548; --k-d2: #4d8ff0; --k-d3: #9d7ff2; --k-map: #de6fb6; --k-x: #8a8f9c; }
  .ico { width: 26px; height: 26px; border-radius: 7px; display: inline-grid; place-items: center; flex: none; background: color-mix(in srgb, var(--kc) 16%, transparent); color: var(--kc); }
  .ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .k-mic { --kc: var(--k-mic); } .k-ptc { --kc: var(--k-ptc); } .k-d2 { --kc: var(--k-d2); } .k-d3 { --kc: var(--k-d3); } .k-map { --kc: var(--k-map); } .k-x { --kc: var(--k-x); }
  .railbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .railbar h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink2); }
  .job { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 0 10px; align-items: center; padding: 6px 12px 6px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .job .ico { grid-row: 1 / span 2; }
  .job:hover { background: var(--well); }
  .job.sel { background: var(--data-dim); border-left-color: var(--data); }
  .job .t { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job .t .n { color: var(--ink3); font-weight: 400; margin-left: 5px; }
  .job .l { color: var(--ink3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; grid-column: 2 / -1; min-height: 0; }
  .job .l:empty { display: none; }
  .job .k { color: var(--ink2); font-size: 12px; text-align: right; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .job .k .dot { margin-right: 5px; width: 7px; height: 7px; }
  .job.cancelled .t, .job.failed .t { color: var(--ink2); }
  .stg h3 { display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 12px 14px 4px; font-size: 12.5px; font-weight: 600; color: var(--ink2); border-top: 1px solid var(--line); }
  .stg:first-child h3 { border-top: none; }
  .stg h3 .hl { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--ink3); }
  .plain { padding: 2px 0 20px; }
  /* flow: lanes on the left, rows of fixed height */
  .wrap.flowing { grid-template-columns: 380px 1fr; }
  .flowr { position: relative; padding-bottom: 20px; }
  .flowr .job { height: 46px; padding: 3px 12px 3px calc(var(--gut) + 4px); overflow: hidden; }
  .flowr .job .l { display: block; }
  .flowsvg { position: absolute; left: 0; top: 0; pointer-events: none; }
  .flowsvg .edges path { fill: none; stroke: var(--axis); stroke-width: 1.6; }
  .flowsvg circle { fill: var(--kc); stroke: var(--surface); stroke-width: 2; }
  .flowsvg circle.queued, .flowsvg circle.cancelled { fill: var(--surface); stroke: var(--kc); stroke-width: 1.6; }
  .flowsvg circle.failed { fill: var(--bad); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--ink3); }
  .dot.finished { background: var(--good); } .dot.running { background: var(--you); } .dot.failed { background: var(--bad); }
  .dot.queued { background: transparent; border: 1.5px solid var(--ink2); } .dot.waiting { background: var(--you); border-radius: 2px; }
  .dot.cancelled { background: var(--axis); }
  .fin { color: var(--you); font-size: 12px; margin-left: 6px; font-weight: 400; }

  /* job */
  .head { display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 6px 36px; padding: 18px 26px 14px; }
  .head h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.3px; }
  .head .sub { color: var(--ink2); font-size: 13px; margin-top: 4px; }
  .head .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .jhead { display: flex; align-items: center; gap: 14px; padding: 20px 28px 12px; flex-wrap: wrap; }
  .ico.big { width: 38px; height: 38px; border-radius: 10px; } .ico.big svg { width: 21px; height: 21px; }
  .jhead .title { flex: 1 1 380px; min-width: 0; }
  .jhead h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jhead h1 .jn { color: var(--ink3); font-weight: 500; }
  .jhead .sub { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; color: var(--ink2); font-size: 13px; margin-top: 3px; }
  .jhead .state.finished { color: var(--good); } .jhead .state.running, .jhead .state.waiting { color: var(--you); } .jhead .state.failed { color: var(--bad); }
  .jhead .state .dot { width: 7px; height: 7px; margin-right: 6px; }
  .jhead .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .jhead .menu summary { padding: 6px 12px; } .jhead .menu summary::after { content: ""; }
  button.stopb { border-color: #5A2A2C; color: #F2A5A7; } button.stopb:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; padding: 0 28px 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; min-width: 0; }
  .kpi .v { font-size: 20px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .v small { font-size: 13px; font-weight: 500; color: var(--ink2); margin-left: 3px; }
  .kpi .c { color: var(--ink2); font-size: 12.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .kpi .spark { width: 100%; height: 26px; display: block; margin-top: 4px; } .kpi .spark path { fill: none; stroke: var(--data); stroke-width: 1.5; }
  .kpi.warnk { border-color: #6B3A28; } .kpi.warnk .c { color: var(--serious); }
  .num .v { font-size: 21px; font-weight: 700; letter-spacing: -.4px; line-height: 1.15; white-space: nowrap; }
  .num .v small { font-size: 13px; font-weight: 500; color: var(--ink2); margin-left: 2px; }
  .num .c { color: var(--ink3); font-size: 12px; white-space: nowrap; }
  .warn { margin: 0 28px 8px; border-left: 3px solid var(--serious); background: var(--well); padding: 6px 12px; border-radius: 0 7px 7px 0; font-size: 13px; }
  .err { color: var(--bad); }
  .stage { margin: 4px 28px 0; border-radius: 12px; position: relative; }
  .stage > .launch, .stage > .v3, .v3host > .v3, .v3host > .launch { background: #000; border-radius: 12px; overflow: hidden; }
  .vgrid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .vmain { min-width: 0; }
  .vside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .vcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .vcard h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); }
  .vplot img { width: 100%; display: block; border-radius: 6px; }
  table.vst { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.vst td { padding: 3px 0; vertical-align: top; } table.vst td:first-child { color: var(--ink2); padding-right: 10px; white-space: nowrap; }
  table.vst td:last-child { text-align: right; }
  table.vst .ok { color: var(--good); }
  @media (max-width: 1200px) { .vgrid { grid-template-columns: 1fr; } }
  .vstrip { margin-top: 10px; } .vrow { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
  .vrow figure { margin: 0; } .vrow .tile { aspect-ratio: 1; background: #000; border-radius: 6px; overflow: hidden; } .vrow .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .vrow .tile.four { outline: 1px solid var(--line); outline-offset: -1px; } .vrow figcaption { font-size: 11.5px; color: var(--ink3); text-align: center; margin-top: 3px; }
  .fnote { font-size: 12.5px; margin-top: 8px; } .fnote b { color: var(--ink2); }
  @media (max-width: 1100px) { .vrow { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .stage > .gal { background: #000; border-radius: 0 0 12px 12px; } .stage > .gal-tools { border-radius: 12px 12px 0 0; border: 1px solid var(--line); }
  .stage:empty { display: none; }
  .tabs { display: flex; gap: 2px; padding: 18px 28px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--plane); z-index: 3; }
  .tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--ink2); padding: 8px 12px; font-size: 13.5px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--data); }
  .tabs button::before { content: "▸"; display: inline-block; width: 1em; color: var(--ink3); transition: transform .15s; }
  .tabs button.on::before { transform: rotate(90deg); color: var(--data); }
  .tabs .cnt { font-size: 11.5px; color: var(--ink3); margin-left: 3px; }
  .tabs .tabhint { margin-left: auto; align-self: center; font-size: 12px; }
  .pane { padding: 20px 28px 70px; }
  .pane[hidden] { display: none; }
  .numcard { margin: 0 0 12px; }
  .cmpbar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--well); font-size: 13px; }
  .cmpbar span { margin-right: auto; color: var(--ink2); }
  .job.cmp { box-shadow: inset 3px 0 0 var(--you); }
  .cmpgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 0 28px 40px; }
  @media (max-width: 1200px) { .cmpgrid { grid-template-columns: 1fr; } }
  table.cmpt { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cmpt th, table.cmpt td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  table.cmpt td:first-child { color: var(--ink2); white-space: nowrap; }
  table.cmpt th a { color: var(--ink); text-decoration: none; font-weight: 600; }
  .cmpdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .numfigs { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; }
  .numfigs .vplot img { max-height: 520px; object-fit: contain; }
  dl.nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px 22px; margin: 4px 0 2px; }
  dl.nums div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding: 3px 0; min-width: 0; }
  dl.nums dt { color: var(--ink2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  dl.nums dd { margin: 0; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--ink2); }
  .empty { color: var(--ink2); padding: 60px 30px; text-align: center; }
  .empty h1 { color: var(--ink); font-size: 20px; }

  /* figures: a grid at their own size (a wide figure takes the row) */
  .figsec { margin-bottom: 28px; } .figsec h3 { font-size: 15px; font-weight: 600; color: var(--ink); margin: 0 0 10px; }
  .figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 1500px) { .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 1100px) { .figs { grid-template-columns: 1fr; } .fig.wide { grid-column: auto; } }
  .fig { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
  .fig.wide { grid-column: span 2; }
  .fig.big { grid-column: 1 / -1; }
  .fig:not(.big) .plot img { max-height: 460px; object-fit: contain; }
  .fig .bar .row { display: flex; gap: 6px; align-items: center; }
  .fig button.grow { padding: 1px 7px; font-size: 13px; line-height: 1.3; color: var(--ink2); }
  .fig .bar { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; font-size: 13.5px; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--line); }
  .fig .plot { min-height: 40px; }
  .fig img { width: 100%; display: block; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 3px 10px; font-size: 12px; background: var(--well); color: var(--ink2); }
  .seg button.on { background: var(--raise); color: var(--ink); }

  /* project home */
  .home { padding: 26px 30px 60px; display: flex; flex-direction: column; gap: 24px; max-width: 1500px; }
  .homehead h1 { margin: 0; font-size: 22px; } .homehead p { margin: 4px 0 0; }
  .stages4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1100px) { .stages4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stc { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .stc:hover:not(:disabled) { border-color: var(--kc); } .stc:disabled { opacity: .55; cursor: default; }
  .stc .sth { display: flex; align-items: center; gap: 10px; } .stc .sth .muted { margin-left: auto; font-size: 12px; }
  .stc .sq { width: 10px; height: 10px; border-radius: 3px; background: var(--kc); }
  .stc .stbig { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
  .homerow { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .homerow > .card:only-child { grid-column: 1 / -1; }
  .hh { display: flex; align-items: center; gap: 10px; } .hh .dot { margin: 0; }
  .homerun { margin-top: 12px; } .lastl { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chainbars { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .cbh { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; } .bar > div { height: 6px; border-radius: 3px; }
  .youcard { background: var(--you-dim); border: 1px solid #6B5317; } .youcard b.you { color: var(--you); display: block; margin-bottom: 8px; }
  .wj { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; font-size: 13.5px; }
  .h2 { font-size: 13.5px; font-weight: 600; color: var(--ink2); margin: 0 0 10px; }
  /* New job: types by stage, then the form */
  .jtg { margin: 6px 0 22px; } .jtg h3 { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 0 0 10px; }
  .jts { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .jt { display: grid; grid-template-columns: 26px 1fr; gap: 3px 12px; text-align: left; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .jt .ico { grid-row: 1 / span 3; }
  .jt:hover:not(:disabled) { border-color: var(--kc, var(--ink3)); background: var(--well); }
  .jt .jtn { font-weight: 600; font-size: 14px; } .jt .jtb { color: var(--ink2); font-size: 12.5px; line-height: 1.4; } .jt .jtneed { color: var(--ink3); font-size: 12px; }
  .jt.later { opacity: .55; } .jt.later:hover { opacity: .85; }
